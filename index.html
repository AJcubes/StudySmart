<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>StudySmart</title>
    <link rel="stylesheet" href="/src/css/styles.css">
</head>
<body>
<a id="title" href="https://github.com/AJcubes/StudySmart" target="_blank">
    <img src="/src/images/favicon.webp" alt="Logo">
    <h1>StudySmart</h1>
</a>
<div id="auth" style="display: block;">
    <h2>Sign in / Sign up</h2>
    <form id="auth-form">
        <div>
            <label for="email">Email: </label>
            <input id="email" type="email" name="email" placeholder="Email">
        </div>
        <button type="submit">Continue</button>
    </form>
</div>
<div id="dashboard" style="display: none;">
    <form id="update-details">
        <div>
            <span id="email-value"></span>
        </div>
        <div>
            <label for="calendar-url">Toddle Calendar URL: </label>
            <input id="calendar-url" type="text" name="calendar-url" placeholder="Calendar URL">
            <a id="information" href="/src/videos/tutorial.mp4" target="_blank">
                <svg width="20" height="20">
                    <circle fill="#b0d3d3" r="10" cy="10" cx="10"></circle>
                    <text fill="#3a4a58" text-anchor="middle" x="10" y="16">?</text>
                </svg>
            </a>
        </div>
        <div>
            <label for="receive-emails">Receive reminder emails: </label>
            <label id="switch">
                <input id="receive-emails" type="checkbox" name="receive-emails" value="True">
                <span id="slider"></span>
            </label>
        </div>
        <button type="submit">Save</button>
        <button id="sign-out" type="button">Sign Out</button>
    </form>
    <h2>To Do:</h2>
    <div id="to-do"></div>
</div>
<script src="src/js/script.js"></script>
</body>
</html>
