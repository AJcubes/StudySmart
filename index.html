<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>StudySense</title>
</head>
<body>
<div id="auth">
    <h1>Sign in / Sign up</h1>
    <form id="auth-form">
        <div>
            <label for="email">Email: </label>
            <input id="email" type="email" name="email" placeholder="Email">
        </div>
        <br>
        <button type="submit">Continue</button>
    </form>
</div>
<div id="dashboard" style="display: none;">
    <h1>StudySense</h1>
    <form id="update-details">
        <div>
            <label for="email-update">Email: </label>
            <input id="email-update" type="email" name="email" placeholder="Email">
        </div>
        <br>
        <div>
            <label for="calendar-url">Calendar URL: </label>
            <input id="calendar-url" type="text" name="calendar-url" placeholder="Calendar URL">
        </div>
        <br>
        <div>
            <label for="receive-emails">Receive emails: </label>
            <input id="receive-emails" type="checkbox" name="receive-emails" value="True">
        </div>
        <br>
        <button type="submit">Save</button>
    </form>
    <button id="sign-out">Sign Out</button>
    <h2>To Do:</h2>
    <div id="to-do"></div>
</div>
<script src="script.js"></script>
</body>
</html>
