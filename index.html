<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blob & URL Fetcher</title>
</head>
<body>

<div id="auth-section">
    <h2>Sign In / Sign Up</h2>
    <form id="user-form">
        <div>
            <label>Email: </label>
            <input type="email" id="email-input" required placeholder="name@example.com">
        </div>
        <br>
        <div>
            <label>URL: </label>
            <input type="url" id="url-input" placeholder="https://example.com/feed.ics">
        </div>
        <br>
        <div>
            <label>
                <input type="checkbox" id="email-checkbox"> Email Enabled
            </label>
        </div>
        <br>
        <button type="submit">Save & Continue</button>
    </form>
</div>

<div id="dashboard-section" style="display:none;">
    <h2 id="welcome-msg"></h2>
    <p><strong>Saved URL:</strong> <span id="display-url"></span></p>
    <p><strong>Email Option:</strong> <span id="display-checkbox-status"></span></p>
    <button id="sign-out-btn">Sign Out</button>

    <h3>Fetched Content Result:</h3>
    <pre id="result-box" style="background:#f4f4f4; padding:10px; border:1px solid #ccc; max-height:400px; overflow:auto;"></pre>
</div>

<script src="script.js"></script>
</body>
</html>
