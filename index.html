<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>StudySmart</title>
    <link rel="stylesheet" href="/src/css/styles.css">
</head>
<body>
<a id="title" href="https://github.com/AJcubes/StudySmart" target="_blank" rel="noopener noreferrer">
    <img src="/src/images/favicon.png" alt="Logo">
    <h1>StudySmart</h1>
</a>
<div id="auth" style="display: block;">
    <h2>Sign in / Sign up</h2>
    <form id="auth-form" method="POST">
        <div>
            <label for="email">School Email: </label>
            <input id="email" name="email" placeholder="School Email" type="email" autocomplete="email" required>
        </div>
        <button type="submit">Continue</button>
    </form>
</div>
<div id="dashboard" style="display: none;">
    <form id="update-details" method="POST">
        <div>
            <span id="email-value"></span>
        </div>
        <div>
            <label for="calendar-url">Toddle Calendar URL <span id="brackets">(follow the <a href="/src/videos/tutorial.mp4" target="_blank" rel="noopener noreferrer">tutorial</a> <i>first</i>)</span>: </label>
            <input id="calendar-url" name="calendar-url" placeholder="Toddle Calendar URL"  type="url" pattern="https://ap-east-1-production-apis\.toddleapp\.com/calendar/v1/feed/basic\.ics.*" autocomplete="url" required>
        </div>
        <div>
            <label for="receive-emails">Receive Reminder Emails: </label>
            <label id="switch">
                <input id="receive-emails" type="checkbox" name="receive-emails" value="True">
                <span id="slider"></span>
            </label>
        </div>
        <button type="submit">Save</button>
        <button id="sign-out" type="button">Sign Out</button>
    </form>
    <h2>To Do:</h2>
    <div id="to-do"></div>
</div>
<script src="src/js/script.js"></script>
</body>
</html>
